version: "3"

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  install:
    desc: "Install NPM dependencies"
    cmds:
      - npm install

  dev:
    desc: "Run the launcher in development mode"
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    cmds:
      - npm run tauri dev

  build:
    desc: "Build the launcher for production (generic)"
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
    cmds:
      - npm run tauri build

  build:linux:
    desc: "Build AppImage for Linux (Arch) → build/"
    cmds:
      - bash scripts/build-linux.sh

  format:
    desc: "Format code using Prettier (Prettier Validation Skill)"
    cmds:
      - npx prettier --write .

  install:cli:
    desc: "Install 'omega' command into ~/.local/bin"
    cmds:
      - bash scripts/setup-cli.sh
