[package]
name = "omega-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["json", "stream", "form", "multipart"] }
urlencoding = "2.1.3"
tokio = { version = "1", features = ["time", "process", "fs", "io-util", "rt-multi-thread", "sync"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
uuid = { version = "1", features = ["v3", "v4", "v5"] }
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
