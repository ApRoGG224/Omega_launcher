[package]
name = "omega-slint"
version = "0.1.0"
edition = "2021"

[dependencies]
omega-core = { path = "../omega-core" }
slint = "1.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.9"
